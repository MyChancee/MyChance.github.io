<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  (function(){
    try {
      var t = localStorage.getItem("mychance_theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch(e){}
  })();
</script>
<title>MyChance – Demo secciones</title>
<style>
  :root{
    --maroon:#6d0f39;
    --maroon-dark:#560b2d;
    --cream:#fdfaf7;
    --white:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Poppins','Segoe UI',sans-serif;
    background:var(--cream);
    color:var(--maroon);
  }

  /* ===================== SECCIÓN 1: IMPACTO + TESTIMONIOS ===================== */
  .impact-section{
    position:relative;
    padding:60px 20px 90px;
    overflow:hidden;
  }
  .impact-header{
    text-align:center;
    margin-bottom:40px;
  }
  .impact-header h2{
    font-size:clamp(1.8rem,4vw,2.6rem);
    font-weight:800;
    margin:0;
  }
  .impact-header .count{
    color:var(--maroon);
  }

  .testimonial-track{
    position:relative;
    height:320px;
    width:100%;
    overflow:hidden;
  }
  .bubble{
    position:absolute;
    max-width:420px;
    padding:20px 30px;
    border-radius:28px;
    font-weight:700;
    font-size:1.05rem;
    color:#fff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    cursor:pointer;
    will-change:transform;
    animation-name:floatLeft;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
    box-shadow:0 6px 14px rgba(0,0,0,0.15);
    transition:box-shadow .2s;
  }
  .bubble:hover{ box-shadow:0 8px 20px rgba(0,0,0,0.25); }
  .bubble.solid{ background:var(--maroon); }
  .bubble.glass{
    background:rgba(109,15,57,0.45);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.35);
  }
  .bubble.paused{ animation-play-state:paused; }

  @keyframes floatLeft{
    from{ transform:translateX(110vw); }
    to{ transform:translateX(-130%); }
  }

  /* Modal de comentario expandido */
  .comment-modal-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999;
    padding:20px;
  }
  .comment-modal-overlay.open{ display:flex; }
  .comment-modal{
    background:var(--white);
    border-radius:20px;
    max-width:480px;
    width:100%;
    padding:28px;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
    position:relative;
  }
  .comment-modal h3{ margin:0 0 8px; font-size:1.1rem; }
  .comment-modal p{ margin:0; line-height:1.5; color:#333; font-weight:500; }
  .comment-modal .close-btn{
    position:absolute; top:12px; right:16px;
    background:none; border:none; font-size:1.4rem;
    cursor:pointer; color:var(--maroon); font-weight:700;
  }

  /* ===================== SECCIÓN 2: QUÉ OFRECEMOS ===================== */
  .offer-section{
    padding:70px 20px 90px;
    text-align:center;
  }
  .offer-title{
    font-size:clamp(1.8rem,4vw,2.6rem);
    font-weight:800;
    margin:0 0 40px;
  }
  .offer-stage{
    display:grid;
    grid-template-columns: repeat(2, minmax(190px, 280px));
    gap:18px 24px;
    justify-content:center;
    align-items:center;
    max-width:700px;
    margin:0 auto;
    min-height:280px;
  }
  .offer-item{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--maroon);
    color:#fff;
    font-weight:800;
    font-size:1.1rem;
    padding:16px 28px;
    border-radius:30px;
    opacity:0;
    box-shadow:0 6px 14px rgba(0,0,0,0.15);
  }
  .offer-item img{ height:28px; width:28px; object-fit:contain; }
  .offer-item.show-left{ animation:slideInLeft .6s ease forwards; }
  .offer-item.show-right{ animation:slideInRight .6s ease forwards; }

  @keyframes slideInLeft{
    from{ opacity:0; transform:translateX(-60px); }
    to{ opacity:1; transform:translateX(0); }
  }
  @keyframes slideInRight{
    from{ opacity:0; transform:translateX(60px); }
    to{ opacity:1; transform:translateX(0); }
  }

  .offer-item.signup-btn{
    grid-column: 1 / span 2;
    justify-self:center;
    background:var(--maroon-dark);
    cursor:pointer;
    font-size:1.15rem;
  }
</style>
</head>
<body>

<section class="offer-section">
  <h2 class="offer-title">With us, you'll connect with</h2>
  <div class="offer-stage" id="offerStage"></div>
</section>

<section class="impact-section">
  <div class="impact-header">
    <h2>We've helped <span id="userCount" class="count">0</span> users</h2>
  </div>
  <div class="testimonial-track" id="testimonialTrack"></div>
</section>

<div class="comment-modal-overlay" id="commentOverlay">
  <div class="comment-modal">
    <button class="close-btn" id="closeModal">&times;</button>
    <h3 id="modalName"></h3>
    <p id="modalText"></p>
  </div>
</div>

<script>
/* =============== DATOS DE EJEMPLO (sustituir por Supabase real) =============== */
const MOCK_USER_COUNT = 123;
const MOCK_TESTIMONIOS = [
  { nombre:"Usuario 1", comentario:"Gracias a MyChance encontré una beca completa para estudiar ingeniería. Cambió por completo el rumbo de mi carrera y mi vida." },
  { nombre:"Usuario 2", comentario:"Nunca pensé que podría acceder a un intercambio internacional, pero con las oportunidades que vi aquí lo logré." },
  { nombre:"Usuario 3", comentario:"El proceso de aplicar a becas siempre me pareció complicado, MyChance me lo hizo simple y encontré la mía en una semana." },
  { nombre:"Usuario 4", comentario:"Conseguí una pasantía remunerada que me abrió las puertas a mi primer empleo formal. Totalmente recomendado." },
  { nombre:"Usuario 5", comentario:"Como voluntaria encontré un programa increíble que me ayudó a crecer personalmente y conocer gente maravillosa." },
  { nombre:"Usuario 6", comentario:"Estaba perdido buscando cursos gratuitos y aquí encontré justo lo que necesitaba para certificarme." },
];

/* =============== SECCIÓN 1: contador + testimonios =============== */
function animateCount(el, target, duration=1500){
  const start = performance.now();
  function step(now){
    const progress = Math.min((now-start)/duration, 1);
    el.textContent = Math.floor(progress * target);
    if(progress < 1) requestAnimationFrame(step);
    else el.textContent = target;
  }
  requestAnimationFrame(step);
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function initTestimonials(list){
  const track = document.getElementById('testimonialTrack');
  const overlay = document.getElementById('commentOverlay');
  const modalName = document.getElementById('modalName');
  const modalText = document.getElementById('modalText');
  const closeBtn = document.getElementById('closeModal');

  const MAX_CONCURRENT_BUBBLES = 3;
  let activeBubbles = 0;

  const trackHeight = track.clientHeight;
  const laneCount = 3;
  const laneHeight = trackHeight / laneCount;

  let order = shuffle(list);
  let idx = 0;

  function trySpawnBubble(){
    if (activeBubbles >= MAX_CONCURRENT_BUBBLES) return;

    const item = order[idx % order.length];
    idx++;
    activeBubbles++;

    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (Math.random() < 0.5 ? 'glass' : 'solid');
    bubble.textContent = `${item.nombre}: "${item.comentario}"`;

    const lane = Math.floor(Math.random()*laneCount);
    bubble.style.top = (lane*laneHeight + 10) + 'px';

    const duration = 22 + Math.random()*10; // 22-32s
    bubble.style.animationDuration = duration + 's';

    bubble.addEventListener('click', () => {
      bubble.classList.add('paused');
      modalName.textContent = item.nombre;
      modalText.textContent = item.comentario;
      overlay.classList.add('open');
      overlay.dataset.activeBubble = '';
      overlay.onclose = () => bubble.classList.remove('paused');
    });

    bubble.addEventListener('animationend', () => {
      bubble.remove();
      activeBubbles--;
    });

    track.appendChild(bubble);
  }

  closeBtn.addEventListener('click', () => {
    overlay.classList.remove('open');
    document.querySelectorAll('.bubble.paused').forEach(b => b.classList.remove('paused'));
  });

  trySpawnBubble();
  setInterval(trySpawnBubble, 3500 + Math.random()*2000);
}

/* =============== SECCIÓN 2: qué ofrecemos =============== */
const OFFER_ITEMS = [
  { label:"internships", icon:"", dir:"left",  row:2, col:1 },
  { label:"courses",     icon:"", dir:"right", row:1, col:2 },
  { label:"scholarships",icon:"", dir:"left",  row:1, col:1 },
  { label:"volunteers",  icon:"", dir:"right", row:2, col:2 },
  { label:"And more +",  icon:"", dir:"left",  row:3, col:1 },
  { label:"competitions",icon:"", dir:"right", row:3, col:2 },
];

function runOfferSequence(){
  const stage = document.getElementById('offerStage');
  stage.innerHTML = '';

  let i = 0;
  function next(){
    if(i < OFFER_ITEMS.length){
      const data = OFFER_ITEMS[i];
      const el = document.createElement('div');
      el.className = 'offer-item ' + (data.dir === 'left' ? 'show-left' : 'show-right');
      el.style.gridRow = data.row;
      el.style.gridColumn = data.col;
      el.innerHTML = `<span>${data.label}</span>`;
      stage.appendChild(el);
      i++;
      setTimeout(next, 900);
    } else {
      const signup = document.createElement('div');
      signup.className = 'offer-item signup-btn show-right';
      signup.style.gridRow = 5;
      signup.innerHTML = `<span>Sign up</span>`;
      signup.addEventListener('click', () => alert('Ir a signup.html'));
      stage.appendChild(signup);

      setTimeout(() => {
        stage.querySelectorAll('.offer-item').forEach(el => el.style.opacity = 0);
        setTimeout(runOfferSequence, 600);
      }, 4000);
    }
  }
  next();
}

/* =============== INIT =============== */
document.addEventListener('DOMContentLoaded', () => {
  const counterEl = document.getElementById('userCount');
  animateCount(counterEl, MOCK_USER_COUNT);
  initTestimonials(MOCK_TESTIMONIOS);
  runOfferSequence();
});
</script>

</body>
</html>
