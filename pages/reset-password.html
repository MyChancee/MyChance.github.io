<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYCHANCE — Nueva contraseña</title>
<link rel="stylesheet" href="../css/login.css">
</head>
<body>

<div class="top-accent"></div>

<main class="hero">
  <div class="modal-card" style="margin: 0 auto;">
    <h3>Crea tu nueva contraseña</h3>
    <p class="sub">Escribe la contraseña que quieres usar de ahora en adelante.</p>

    <div class="field">
      <label for="newPassword">Nueva contraseña</label>
      <input type="password" id="newPassword" placeholder="••••••••">
    </div>

    <button type="button" class="btn-cream" id="btnConfirmReset">Guardar contraseña</button>
    <p id="mensajeReset"></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase/base.js"></script>
<script>
document.getElementById("btnConfirmReset").addEventListener("click", async () => {
  const mensajeReset = document.getElementById("mensajeReset");
  const newPassword = document.getElementById("newPassword").value;

  if (!newPassword) {
    mensajeReset.textContent = "Escribe una contraseña.";
    mensajeReset.style.color = "red";
    return;
  }

  mensajeReset.textContent = "Guardando...";
  mensajeReset.style.color = "inherit";

  const { error } = await supabaseClient.auth.updateUser({
    password: newPassword,
  });

  if (error) {
    mensajeReset.textContent = "Error: " + error.message;
    mensajeReset.style.color = "red";
    return;
  }

  mensajeReset.textContent = "¡Contraseña actualizada! Redirigiendo...";
  mensajeReset.style.color = "green";
  setTimeout(() => {
    window.location.href = "login.html";
  }, 1500);
});
</script>
</body>
</html>
