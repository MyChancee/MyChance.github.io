<script>
  // Carga el nombre y la foto de perfil del usuario logueado en el sidebar.
  async function loadSidebarUser() {
    const { data: userData, error: userError } = await supabaseClient.auth.getUser();
    if (userError || !userData?.user) return;

    const { data: usuario, error } = await supabaseClient
      .from("Usuarios")
      .select("full_name, avatar_url, plan")
      .eq("id", userData.user.id)
      .maybeSingle();

    if (error || !usuario) return;

    const nameEl = document.getElementById("sidebarUserName");
    const avatarEl = document.getElementById("sidebarAvatar");
    const planBadgeEl = document.getElementById("planBadge");
    const sidebarEl = document.querySelector(".sidebar");

    if (nameEl && usuario.full_name) nameEl.textContent = usuario.full_name.split(" ")[0];
    if (avatarEl && usuario.avatar_url) avatarEl.innerHTML = `<img src="${usuario.avatar_url}" alt="">`;

    const isPremium = usuario.plan === "premium" || usuario.plan === "enterprise";
    if (planBadgeEl) {
      const planKeyMap = { free: "sidebar.plan.free", premium: "sidebar.plan.premium", enterprise: "sidebar.plan.enterprise" };
      planBadgeEl.setAttribute("data-i18n", planKeyMap[usuario.plan] || "sidebar.plan.free");
      translateNode(localStorage.getItem(LANG_CACHE_KEY) || "es");
    }
    if (sidebarEl) sidebarEl.classList.toggle("premium", isPremium);
  }

  loadSidebarUser();
</script>
